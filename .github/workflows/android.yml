name: JARVIS V6 Android APK
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/build-tools/36.0.0" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Install SDK packages
        run: sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK" | grep -q "package: name='com.jarvis.v6'"
          $ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$APK" | grep -q "sdkVersion:'26'"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V6-android-source
          path: |
            app/**
            build.gradle
            settings.gradle
            gradle.properties
            .github/workflows/android.yml
